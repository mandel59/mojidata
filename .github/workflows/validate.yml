name: Validate

on:
  pull_request:
  push:
    branches:
      - develop

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run-checks: ${{ steps.scope.outputs.run-checks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: scope
        run: node scripts/ci-change-scope.mjs
      - name: Check CI change classification
        run: node --test scripts/ci-change-scope.test.mjs
      - name: Check database cache fingerprints
        run: python3 scripts/db-build-inputs.test.py

  prepare-db-cache:
    needs: changes
    if: needs.changes.outputs.run-checks == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NO_UPDATE_NOTIFIER: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Compute database cache keys
        id: db-cache-key
        run: python3 scripts/db-cache-key.py

      - name: Restore mojidata build cache
        uses: actions/cache@v4
        with:
          path: |
            packages/mojidata/dist
            packages/mojidata/cache
            packages/mojidata/resources
          key: mojidata-v2-${{ runner.os }}-${{ steps.db-cache-key.outputs.mojidata }}
          restore-keys: |
            mojidata-v2-${{ runner.os }}-

      - name: Restore idsdb build cache
        uses: actions/cache@v4
        with:
          path: |
            packages/idsdb/idsfind.db
            packages/idsdb/idsdecompose.db
            packages/idsdb/.idsdb.input.sha256
            packages/idsdb-fts5/idsfind.db
            packages/idsdb-fts5/idsdecompose.db
            packages/idsdb-fts5/.idsdb-fts5.input.sha256
          key: idsdb-v2-${{ runner.os }}-${{ steps.db-cache-key.outputs.idsdb }}
          restore-keys: |
            idsdb-v2-${{ runner.os }}-

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Prepare mojidata and IDS database artifacts
        run: |
          corepack yarn build:idsdb-stack
          corepack yarn workspace @mandel59/idsdb-fts5 run prepare

  validate-workspaces:
    runs-on: ubuntu-latest
    needs: [changes, prepare-db-cache]
    if: needs.changes.outputs.run-checks == 'true'
    permissions:
      contents: read
    env:
      NO_UPDATE_NOTIFIER: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Compute database cache keys
        id: db-cache-key
        run: python3 scripts/db-cache-key.py

      - name: Restore mojidata build cache
        uses: actions/cache@v4
        with:
          path: |
            packages/mojidata/dist
            packages/mojidata/cache
            packages/mojidata/resources
          key: mojidata-v2-${{ runner.os }}-${{ steps.db-cache-key.outputs.mojidata }}
          restore-keys: |
            mojidata-v2-${{ runner.os }}-

      - name: Restore idsdb build cache
        uses: actions/cache@v4
        with:
          path: |
            packages/idsdb/idsfind.db
            packages/idsdb/idsdecompose.db
            packages/idsdb/.idsdb.input.sha256
            packages/idsdb-fts5/idsfind.db
            packages/idsdb-fts5/idsdecompose.db
            packages/idsdb-fts5/.idsdb-fts5.input.sha256
          key: idsdb-v2-${{ runner.os }}-${{ steps.db-cache-key.outputs.idsdb }}
          restore-keys: |
            idsdb-v2-${{ runner.os }}-

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Check changesets on pull requests
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
        run: corepack yarn changeset status --since=origin/${{ github.base_ref }}

      - name: Build workspace for pull requests
        if: github.event_name == 'pull_request'
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: corepack yarn ci:build:affected

      - name: Build affected workspace for branch pushes
        if: github.event_name != 'pull_request' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          CI_BASE_SHA: ${{ github.event.before }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: corepack yarn ci:build:affected

      - name: Build full workspace for branch creation pushes
        if: github.event_name != 'pull_request' && github.event.before == '0000000000000000000000000000000000000000'
        run: corepack yarn ci:build

      - name: Check publish artifacts for pull requests
        if: github.event_name == 'pull_request'
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: corepack yarn ci:pack:affected

      - name: Check affected publish artifacts for branch pushes
        if: github.event_name != 'pull_request' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          CI_BASE_SHA: ${{ github.event.before }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: corepack yarn ci:pack:affected

      - name: Check full publish artifacts for branch creation pushes
        if: github.event_name != 'pull_request' && github.event.before == '0000000000000000000000000000000000000000'
        run: corepack yarn ci:pack

      - name: Run affected tests for pull requests
        if: github.event_name == 'pull_request'
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: corepack yarn ci:test:affected

      - name: Run affected tests for branch pushes
        if: github.event_name != 'pull_request' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          CI_BASE_SHA: ${{ github.event.before }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: corepack yarn ci:test:affected

      - name: Run full test suite for branch creation pushes
        if: github.event_name != 'pull_request' && github.event.before == '0000000000000000000000000000000000000000'
        run: corepack yarn ci:test

  # Keep the required check named "validate" completing even for docs-only PRs,
  # and fail it if classification or any required heavy job fails.
  validate:
    runs-on: ubuntu-latest
    needs: [changes, prepare-db-cache, validate-workspaces]
    if: always()
    permissions: {}
    steps:
      - name: Report validation result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_CHECKS: ${{ needs.changes.outputs.run-checks }}
          PREPARE_RESULT: ${{ needs.prepare-db-cache.result }}
          VALIDATE_RESULT: ${{ needs.validate-workspaces.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change classification failed."
            exit 1
          fi
          if [[ "$RUN_CHECKS" == "false" ]]; then
            echo "Documentation-only change: heavy validation was skipped." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$RUN_CHECKS" == "true" && "$PREPARE_RESULT" == "success" && "$VALIDATE_RESULT" == "success" ]]; then
            echo "All required validation passed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Required validation failed or did not finish."
            exit 1
          fi
